services:
  postgis:
    container_name: postgis
    image: postgis/postgis
    environment:
     POSTGRES_DB: schoolsystemsql
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: test123
    networks:
      - main
    ports:
      - "5434:5432"
    restart: always
    volumes:
      - postgis_data:/var/lib/postgresql/data

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn schoolsystem.wsgi -b 0.0.0.0:8000"
    container_name: web
    depends_on:
      - postgis
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - main
    restart : always

networks:
  main:
volumes:
  postgis_data: